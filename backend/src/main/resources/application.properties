server.port=${PORT:8080}

spring.application.name=nestio-backend

# Local PostgreSQL (ignored on Render when DATABASE_URL is set)
spring.datasource.url=jdbc:postgresql://localhost:5432/nestio
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Nestio creates rooms from the owner's setup, not a fixed building.
app.seed-building=false

app.auth.token-secret=${APP_TOKEN_SECRET:nestio-local-dev-secret-change-before-internet}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app,https://happy-nest-pg-frontend.vercel.app}

# Spring AI — OpenAI-compatible. Default is Groq (fast). Set AI_API_KEY on Render.
spring.ai.openai.api-key=${AI_API_KEY:not-set}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${AI_MODEL:openai/gpt-oss-20b}
spring.ai.openai.chat.options.temperature=0.2
app.ai.api-key=${AI_API_KEY:not-set}

# Phone alerts at 9:00 and 19:00 India time. Rent reminders start on the 6th.
app.notify.zone=Asia/Kolkata
app.notify.morning-hour=9
app.notify.evening-hour=19
app.notify.rent-day=6

